services:
  app-price:
    # 拉取 GitHub Actions 自动构建的镜像（推荐）
    image: ghcr.io/oceanxux/appatlas:main
    # 本地构建（开发调试用）：注释掉上面 image 行，取消下行注释
    # build: .
    container_name: app-price
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      # 持久化账号数据与接口缓存（重启容器不丢失）
      - ./data:/app/data
    environment:
      - APT_DATA_DIR=/app/data
    mem_limit: 128m
