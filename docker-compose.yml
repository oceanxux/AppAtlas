services:
  app-price:
    # 方式一：本地构建
    build: .
    # 方式二：拉取 GitHub Actions 构建好的镜像（推到 GitHub 后启用，替换 <你的用户名>/<仓库名>）
    # image: ghcr.io/<你的用户名>/<仓库名>:latest
    container_name: app-price
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      # 持久化账号数据与接口缓存（重启容器不丢失）
      - ./data:/app/data
    environment:
      - APT_DATA_DIR=/app/data
    mem_limit: 128m
