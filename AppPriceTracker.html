<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>App Store 价格全览</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cstyle%3E:root%7B--c:%234338ca;--a:%234f46e5%7D@media(prefers-color-scheme:dark)%7B:root%7B--c:%23a5b4fc;--a:%23818cf8%7D%7D%3C/style%3E%3Cg fill='none' stroke='var(--c)' stroke-linecap='round'%3E%3Cpath d='M46.74 31.05A17 17 0 1 1 42.02 21.98' stroke-width='4.4'/%3E%3Cellipse cx='30' cy='34' rx='7' ry='17' stroke-width='2.6' opacity='.35'/%3E%3Cpath d='M13.5 34h33' stroke-width='2.6' opacity='.35'/%3E%3C/g%3E%3Cpath d='M13 47 26 38 33 42 49.5 20' fill='none' stroke='var(--a)' stroke-width='4.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='52' cy='16.5' r='4.4' fill='var(--a)'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --panel2:#eef0f3;
    --border:#e4e6ea; --hair:#f1f2f4; --hair2:#e9eaee;
    --text:#17181c; --muted:#82858d; --muted2:#5a5d66;
    --accent:#4f46e5; --accent-h:#4338ca; --accent-soft:rgba(79,70,229,.10);
    --danger:#e5484d;
    --low:#0e9f6e; --high:#e5484d;
    --green:#0e9f6e; --green-bg:rgba(16,185,129,.12);
    --green-border:rgba(14,159,110,.32);
    --row-hover:#f8f9fb; --thead:#fafbfc;
    --nav-bg:rgba(246,247,249,.85);
    --shadow-sm:0 1px 2px rgba(23,24,28,.05);
    --shadow:0 8px 28px rgba(23,24,28,.08);
    --pill:980px;
    color-scheme:light;
  }
  :root[data-theme="dark"]{
    --bg:#0e0f13; --panel:#16181d; --panel2:#1f2228;
    --border:#262a31; --hair:#1d2026; --hair2:#24272e;
    --text:#edeff2; --muted:#8d93a0; --muted2:#b6bcc7;
    --accent:#818cf8; --accent-h:#93a0fa; --accent-soft:rgba(129,140,248,.16);
    --danger:#ff6b70;
    --low:#34d399; --high:#ff6b70;
    --green:#34d399; --green-bg:rgba(52,211,153,.14);
    --green-border:rgba(52,211,153,.4);
    --row-hover:#1b1e24; --thead:#191c21;
    --nav-bg:rgba(14,15,19,.82);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow:0 8px 28px rgba(0,0,0,.5);
    color-scheme:dark;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI","Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  a{color:var(--accent);text-decoration:none}
  ::selection{background:var(--accent-soft)}
  button{font-family:inherit}

  .container{max-width:1120px;margin:0 auto;padding:0 24px}

  /* ===== 顶部导航 ===== */
  .nav{position:sticky;top:0;z-index:100;background:var(--nav-bg);
    backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);
    border-bottom:1px solid var(--hair2)}
  .nav-inner{max-width:1120px;margin:0 auto;padding:0 24px;height:56px;
    display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{font-size:15.5px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;
    cursor:pointer;display:flex;align-items:center;gap:8px}
  .brand .logo{width:28px;height:28px;display:inline-flex;align-items:center;flex-shrink:0;color:var(--text)}
  .brand .logo svg{width:100%;height:100%;display:block}
  .nav-actions{display:flex;align-items:center;gap:8px}
  .lang-switch{display:inline-flex;background:var(--panel2);border-radius:9px;padding:2px}
  .lang-switch button{border:none;background:transparent;padding:4px 13px;border-radius:7px;
    font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;transition:all .15s}
  .lang-switch button.active{background:var(--panel);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.14)}
  .icon-btn{height:32px;width:34px;padding:0;border-radius:9px;border:1px solid transparent;
    background:transparent;cursor:pointer;font-size:15px;line-height:1;color:var(--muted2);
    display:inline-flex;align-items:center;justify-content:center;transition:all .15s}
  .icon-btn:hover{background:var(--panel2)}
  .user-chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;
    border-radius:var(--pill);background:var(--panel2);font-size:12.5px;font-weight:500;color:var(--text);
    max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ===== 按钮 ===== */
  .btn{height:38px;padding:0 18px;border-radius:var(--pill);border:1px solid var(--border);
    background:var(--panel);color:var(--text);cursor:pointer;font-size:13.5px;font-weight:500;
    transition:all .15s;white-space:nowrap;line-height:1;display:inline-flex;align-items:center;gap:6px}
  .btn:hover{background:var(--panel2);border-color:#cfd2d8}
  :root[data-theme="dark"] .btn:hover{border-color:#3a3f48}
  .btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
  .btn.primary{background:linear-gradient(180deg,#5b53f0,#4f46e5);border-color:transparent;color:#fff;
    box-shadow:0 2px 10px rgba(79,70,229,.3)}
  .btn.primary:hover{background:linear-gradient(180deg,#4f47e8,#4338ca)}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--muted2)}
  .btn.soft{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
  .btn.ghost:hover{background:var(--panel2);color:var(--text)}
  .btn.sm{height:30px;padding:0 12px;font-size:12px}
  .btn:focus-visible{box-shadow:0 0 0 3px var(--accent-soft);outline:none}
  .gated-locked::after{content:" 🔒";font-size:11px}

  /* ===== 页面切换 ===== */
  .view{display:none}
  .view.anim{animation:fadeUp .3s ease both}

  /* ===== 首页 Hero ===== */
  .hero{position:relative;text-align:center;padding:84px 24px 40px;overflow:hidden}
  .hero::before{content:"";position:absolute;top:-200px;left:50%;transform:translateX(-50%);
    width:920px;height:460px;pointer-events:none;
    background:radial-gradient(closest-side,rgba(99,102,241,.14),transparent 70%)}
  .hero::after{content:"";position:absolute;top:-60px;left:calc(50% + 180px);
    width:520px;height:380px;pointer-events:none;
    background:radial-gradient(closest-side,rgba(14,165,233,.10),transparent 70%)}
  .hero > *{position:relative}
  .hero-badge{display:inline-flex;align-items:center;gap:8px;padding:7px 16px;
    border-radius:var(--pill);background:var(--accent-soft);color:var(--accent);
    font-size:13px;font-weight:500;margin-bottom:20px}
  .hero h1{font-size:clamp(30px,5vw,48px);font-weight:700;letter-spacing:-.022em;
    line-height:1.12;margin:0 0 14px}
  .hero .lead{font-size:16.5px;line-height:1.65;color:var(--muted2);max-width:600px;margin:0 auto}

  /* ===== 搜索框 ===== */
  .search-hero{max-width:620px;margin:34px auto 0;display:flex;gap:10px}
  .search-field{position:relative;flex:1}
  .search-field .s-ico{position:absolute;left:18px;top:50%;transform:translateY(-50%);
    pointer-events:none;opacity:.45;display:flex}
  .search-field input{width:100%;height:54px;border:1px solid var(--border);
    background:var(--panel);border-radius:var(--pill);padding:0 20px 0 46px;font-size:16px;color:var(--text);
    outline:none;transition:box-shadow .18s,border-color .18s;font-family:inherit;box-shadow:var(--shadow-sm)}
  .search-field input::placeholder{color:var(--muted)}
  .search-field input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
  .search-hero .btn{height:54px;padding:0 30px;font-size:15px;border-radius:var(--pill)}

  /* ===== 热门 App ===== */
  .quick{max-width:920px;margin:52px auto 0;text-align:left}
  .section-title{font-size:13px;font-weight:600;color:var(--muted2);margin:0 0 12px;
    display:flex;justify-content:space-between;align-items:center;letter-spacing:.02em}
  .quick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .quick-grid.top{grid-template-columns:repeat(4,1fr)}
  .quick-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:9px;padding:18px 10px 15px;
    border-radius:16px;background:var(--panel);border:1px solid var(--hair2);cursor:pointer;
    transition:all .15s;text-align:center}
  .quick-card .rank{position:absolute;top:7px;left:11px;font-size:11px;font-weight:700;
    color:var(--muted);opacity:.75;font-variant-numeric:tabular-nums}
  .quick-card:hover{border-color:var(--border);box-shadow:var(--shadow);transform:translateY(-2px)}
  .quick-card img{width:56px;height:56px;border-radius:14px;object-fit:cover;
    box-shadow:0 4px 12px rgba(0,0,0,.12);background:var(--panel2)}
  .quick-card .name{font-size:13px;font-weight:600;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .quick-card .dev{font-size:11px;color:var(--muted);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ===== 搜索结果页 ===== */
  .page-head{padding:44px 0 8px;text-align:center}
  .page-head h2{font-size:24px;font-weight:700;letter-spacing:-.015em;margin:0 0 18px}
  .searchbar-compact{max-width:620px;display:flex;gap:10px;margin:0 auto}
  .searchbar-compact .search-field input{height:44px;font-size:14.5px}
  .searchbar-compact .btn{height:44px;padding:0 24px}
  .results-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px;padding:22px 0 40px}
  .result-card{display:flex;gap:14px;padding:16px;border-radius:16px;cursor:pointer;align-items:center;
    border:1px solid var(--hair2);background:var(--panel);transition:all .15s}
  .result-card:hover{border-color:var(--border);box-shadow:var(--shadow);transform:translateY(-1px)}
  .result-card img{width:56px;height:56px;border-radius:14px;object-fit:cover;flex-shrink:0;background:var(--panel2)}
  .result-card .meta{flex:1;min-width:0}
  .result-card .name{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .result-card .dev{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .result-card .desc{color:var(--muted2);font-size:12px;line-height:1.5;margin-top:5px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .result-card .go{color:var(--muted);font-size:18px;flex-shrink:0}

  /* ===== 详情页 ===== */
  .back-row{padding:22px 0 0}
  .detail-head{display:flex;gap:20px;align-items:center;flex-wrap:wrap;
    background:var(--panel);border:1px solid var(--hair2);border-radius:20px;
    padding:22px 24px;margin-top:14px;box-shadow:var(--shadow-sm)}
  .app-card{display:flex;gap:18px;align-items:center;flex:1;min-width:240px}
  .app-card img{width:88px;height:88px;border-radius:22px;object-fit:cover;
    box-shadow:0 10px 28px rgba(0,0,0,.16);flex-shrink:0;background:var(--panel2)}
  .app-card .info{min-width:0}
  .app-card h2{margin:0 0 4px;font-size:25px;font-weight:700;letter-spacing:-.015em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .app-card .dev{color:var(--muted2);font-size:14px}
  .app-desc{color:var(--muted);font-size:12.5px;line-height:1.55;margin-top:7px;max-width:560px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .badges{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
  .badge{font-size:11.5px;padding:3px 10px;border-radius:var(--pill);
    background:var(--panel2);color:var(--muted2);font-weight:500}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

  .mode-tabs{display:flex;gap:24px;border-bottom:1px solid var(--hair2);margin:22px 0 16px}
  .mode-tabs button{flex:0 0 auto;border:none;background:transparent;color:var(--muted);
    padding:10px 2px 12px;cursor:pointer;font-size:15px;font-weight:600;position:relative;
    white-space:nowrap;transition:color .15s}
  .mode-tabs button:hover{color:var(--muted2)}
  .mode-tabs button.active{color:var(--text)}
  .mode-tabs button.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;
    height:3px;border-radius:3px;background:currentColor}
  .mode-tabs .count{font-size:11px;color:var(--accent);font-weight:600;margin-left:5px}

  .offer-search{display:flex;gap:10px;margin-bottom:12px;align-items:center}
  .offer-search input{flex:1;height:40px;padding:0 16px;border-radius:var(--pill);border:1px solid var(--hair2);
    background:var(--panel);color:var(--text);font-size:13.5px;outline:none;font-family:inherit;
    transition:border-color .18s,box-shadow .18s}
  .offer-search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .offer-search .hit{font-size:12px;color:var(--muted);white-space:nowrap}

  .offer-bar{background:var(--panel2);border-radius:var(--pill);padding:6px;margin-bottom:16px;
    display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
  .offer-bar::-webkit-scrollbar{display:none}
  .offer-chip{flex:0 0 auto;padding:9px 16px;border-radius:var(--pill);border:none;
    background:transparent;cursor:pointer;font-size:13.5px;display:flex;gap:8px;align-items:center;
    color:var(--muted2);font-weight:500;white-space:nowrap;transition:all .12s;font-family:inherit}
  .offer-chip:hover{color:var(--text)}
  .offer-chip.active{background:var(--panel);color:var(--text);font-weight:700;
    box-shadow:0 2px 10px rgba(23,24,28,.1)}
  .offer-chip .period{font-size:11px;font-weight:600;padding:2px 8px;border-radius:var(--pill);
    border:1px solid var(--green-border);color:var(--green)}

  /* 多 App 对比弹窗里的选择胶囊（保留传统样式） */
  .pick-chip{padding:7px 14px;border-radius:var(--pill);border:none;background:var(--panel2);
    cursor:pointer;font-size:13px;display:flex;gap:7px;align-items:center;color:var(--text);
    transition:all .12s;font-family:inherit}
  .pick-chip:hover{filter:brightness(.96)}
  :root[data-theme="dark"] .pick-chip:hover{filter:brightness(1.25)}
  .pick-chip.active{background:var(--accent);color:#fff}
  .pick-chip .period{font-size:11px;opacity:.65}

  #modeDesc{font-size:13px;color:var(--muted2);margin-bottom:14px}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:16px}
  .stat-card{background:var(--panel);border:1px solid var(--hair2);border-radius:16px;padding:16px 18px}
  .stat-card .label{font-size:11.5px;color:var(--muted);font-weight:500;letter-spacing:.02em}
  .stat-card .value{font-size:21px;font-weight:700;margin-top:6px;letter-spacing:-.01em;
    font-variant-numeric:tabular-nums}
  .stat-card .sub{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stat-card.low{background:linear-gradient(180deg,var(--green-bg),transparent)}
  .stat-card.low .value{color:var(--low)}
  .stat-card.high{background:linear-gradient(180deg,rgba(229,72,77,.08),transparent)}
  .stat-card.high .value{color:var(--high)}

  .filter-bar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
  .filter-bar input,.filter-bar select{height:38px;padding:0 15px;border-radius:var(--pill);
    border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:13px;
    outline:none;font-family:inherit}
  .filter-bar input{min-width:170px}
  .filter-bar input:focus,.filter-bar select:focus{box-shadow:0 0 0 3px var(--accent-soft);border-color:var(--accent)}
  #progressText{color:var(--muted);font-size:12px;white-space:nowrap}
  .progress{flex:1;min-width:150px;height:6px;background:var(--panel2);border-radius:var(--pill);overflow:hidden}
  .progress-bar{height:100%;background:var(--accent);border-radius:var(--pill);transition:width .2s}

  .table-wrap{background:var(--panel);border:1px solid var(--hair2);border-radius:16px;overflow:auto}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{padding:11px 14px;text-align:left;font-weight:600;color:var(--muted2);
    font-size:12px;border-bottom:1px solid var(--hair2);white-space:nowrap;
    position:sticky;top:0;background:var(--thead);z-index:1}
  #priceTable th[data-sort]{cursor:pointer;user-select:none}
  #priceTable th[data-sort]:hover{color:var(--text)}
  #priceTable th.sorted{color:var(--accent)}
  #priceTable th.sorted::after{content:attr(data-arrow);margin-left:4px}
  td{padding:11px 14px;border-bottom:1px solid var(--hair)}
  tr:last-child td{border-bottom:none}
  tbody tr:hover td{background:var(--row-hover)}
  .row-low td{background:var(--green-bg)}
  .row-low td:first-child{box-shadow:inset 3px 0 0 var(--low)}
  .row-high td{background:rgba(229,72,77,.06)}
  .row-high td:first-child{box-shadow:inset 3px 0 0 var(--high)}
  .country-cell{display:flex;align-items:center;gap:9px;font-weight:500}
  .flag{font-size:18px;width:24px;text-align:center}
  .price-cell{font-variant-numeric:tabular-nums;font-weight:600}
  .delta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:500}
  .delta.up{color:var(--high)}
  .status{font-size:11.5px;padding:3px 10px;border-radius:var(--pill);display:inline-block;font-weight:500}
  .status.ok{background:var(--green-bg);color:var(--green)}
  .status.free{background:var(--accent-soft);color:var(--accent)}
  .status.na{background:var(--panel2);color:var(--muted)}

  /* ===== 历史图表 ===== */
  .chart-panel{background:var(--panel);border:1px solid var(--hair2);border-radius:16px;
    padding:18px 20px;margin-top:16px}
  .chart-panel .head{display:flex;justify-content:space-between;align-items:baseline;
    margin-bottom:10px;flex-wrap:wrap;gap:8px}
  .chart-panel h4{margin:0;font-size:15px;font-weight:600}
  .chart-panel .sub{font-size:11.5px;color:var(--muted)}
  .chart-svg{width:100%;height:auto;display:block;background:transparent}
  .chart-axis text{fill:var(--muted);font-size:10.5px}
  .chart-axis line{stroke:var(--hair2);stroke-dasharray:3,4}
  .chart-line{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .chart-dot{cursor:pointer;transition:r .12s}
  .chart-dot:hover{r:5.5}
  .chart-tooltip{position:absolute;pointer-events:none;background:rgba(23,24,28,.94);color:#fff;
    padding:7px 11px;border-radius:10px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.22);
    z-index:100;display:none;white-space:nowrap}
  :root[data-theme="dark"] .chart-tooltip{background:rgba(60,63,70,.97)}
  .chart-legend{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
  .chart-legend-item{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;
    border-radius:var(--pill);border:1px solid var(--hair2);background:var(--panel);cursor:pointer;
    font-size:12px;user-select:none;transition:opacity .15s}
  .chart-legend-item.dim{opacity:.35}
  .chart-legend-item .swatch{width:9px;height:9px;border-radius:50%}

  .footer-note{margin-top:44px;text-align:center;color:var(--muted);font-size:11.5px;padding:16px 0 40px}

  /* ===== 监控列表 ===== */
  .watch-zone{padding:8px 0 20px}
  .watchlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
  .watch-item{display:flex;gap:10px;padding:12px;border-radius:14px;background:var(--panel);
    border:1px solid var(--hair2);cursor:pointer;align-items:center;transition:all .15s}
  .watch-item:hover{border-color:var(--border);box-shadow:var(--shadow-sm)}
  .watch-item.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .watch-item img{width:38px;height:38px;border-radius:9px;object-fit:cover;flex-shrink:0}
  .watch-item .meta{flex:1;min-width:0}
  .watch-item .name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .watch-item .stat{font-size:11px;color:var(--muted);margin-top:1px}
  .watch-item .check-wrap{flex-shrink:0;display:flex;align-items:center}
  .watch-item input[type=checkbox]{margin:0;cursor:pointer;accent-color:var(--accent)}

    .search-hero{flex-direction:column;gap:10px}

    .quick-grid,.quick-grid.top{grid-template-columns:repeat(2,1fr)}

    .filter-bar{flex-direction:column;align-items:stretch}

    #countryFilter{width:100%}
    .table-wrap{border-radius:14px}

    .admin-user-row{flex-wrap:wrap;gap:8px}

    .multi-bar{left:12px;right:12px;transform:none;border-radius:16px;flex-wrap:wrap;bottom:16px}
    .shot-strip img{height:220px}
    .info-grid{grid-template-columns:repeat(2,1fr)}
    .toast{max-width:92vw}
    .user-chip{max-width:88px}
  }
  @media (max-width:400px){
    .brand > span:last-child{display:none}
    .nav-inner{gap:6px}
    .lang-switch button{padding:4px 9px;font-size:11px}
    .hero h1{font-size:24px}
    .hero .lead{font-size:13.5px}
    .quick-grid,.quick-grid.top{gap:8px}
    .quick-card{padding:14px 8px 12px}
    .quick-card img{width:48px;height:48px}
    .btn{height:42px}
    .stat-card .value{font-size:17px}
  }
</style>
</head>
<body>

<!-- ===== 顶部导航 ===== -->
<nav class="nav">
  <div class="nav-inner">
    <div class="brand" id="brandHome"><span class="logo"><svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-linecap="round"><path d="M46.74 31.05A17 17 0 1 1 42.02 21.98" stroke-width="4.4"/><ellipse cx="30" cy="34" rx="7" ry="17" stroke-width="2.6" opacity=".35"/><path d="M13.5 34h33" stroke-width="2.6" opacity=".35"/></g><path d="M13 47 26 38 33 42 49.5 20" fill="none" stroke="var(--accent)" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="52" cy="16.5" r="4.4" fill="var(--accent)"/></svg></span><span data-i18n="appTitle"></span></div>
    <div class="nav-actions">
      <button class="icon-btn" id="themeBtn" title="切换主题">🌙</button>
      <div class="lang-switch">
        <button data-lang="zh" class="active">中</button>
        <button data-lang="en">EN</button>
      </div>
      <div class="nav-cluster" id="navCluster" style="display:none">
        <button class="nbtn" id="navNotifyBtn" title="监控通知">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="notify-dot" id="notifyDot" style="display:none"></span>
        </button>
        <span class="nav-sep"></span>
        <button class="nbtn nbtn-txt" id="navApiBtn" data-i18n="apiNav"></button>
        <button class="nbtn nbtn-txt" id="navAdminBtn" data-i18n="userMgmt"></button>
        <span class="nav-sep"></span>
        <span class="nav-user-name" id="navUser"></span>
        <button class="nbtn" id="logoutBtn" title="退出登录">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
      <button class="btn sm primary" id="navLoginBtn" data-i18n="loginBtn"></button>
    </div>
  </div>
</nav>

<!-- ===== 首页 ===== -->
<div class="view" id="viewHome">
  <div class="hero">
    <div class="hero-badge"><span>🌐</span><span data-i18n="subtitle"></span></div>
    <h1 data-i18n="emptyTitle"></h1>
    <p class="lead" data-i18n="emptyDesc" data-i18n-html="emptyDesc"></p>
    <div class="search-hero">
      <div class="search-field">
        <span class="s-ico"><svg width="18" height="18" viewBox="0 0 16 16" fill="none"><circle cx="6.5" cy="6.5" r="5" stroke="#82858d" stroke-width="1.6"/><path d="M10.5 10.5L14 14" stroke="#82858d" stroke-width="1.6" stroke-linecap="round"/></svg></span>
        <input id="searchInputHome" data-i18n-attr="placeholder" data-i18n="searchPlaceholder">
      </div>
      <button class="btn primary" id="searchBtnHome" data-i18n="searchBtn"></button>
    </div>
  </div>

  <div class="container">
    <div class="quick" id="quickSection" style="display:none">
      <div class="section-title">
        <span data-i18n="quickTitle"></span>
        <span id="quickUpdated" style="font-weight:400;color:var(--muted);font-size:11.5px"></span>
      </div>
      <div class="quick-grid top" id="quickGrid"></div>
    </div>

    <div class="watch-zone" id="watchSection" style="display:none">
      <div class="section-title">
        <span><span data-i18n="watchlist"></span> (<span id="watchCount">0</span>)</span>
        <button class="btn ghost sm" id="refreshAllBtn" data-i18n="refreshAll"></button>
      </div>
      <div class="watchlist" id="watchlist"></div>
      <div id="watchEmpty" class="empty" data-i18n="watchEmpty"></div>
    </div>
  </div>
</div>

<!-- ===== 搜索结果页 ===== -->
<div class="view" id="viewSearch">
  <div class="container">
    <div class="page-head">
      <div class="searchbar-compact">
        <div class="search-field">
          <span class="s-ico"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="6.5" cy="6.5" r="5" stroke="#82858d" stroke-width="1.6"/><path d="M10.5 10.5L14 14" stroke="#82858d" stroke-width="1.6" stroke-linecap="round"/></svg></span>
          <input id="searchInputPage" data-i18n-attr="placeholder" data-i18n="searchPlaceholder">
        </div>
        <button class="btn primary" id="searchBtnPage" data-i18n="searchBtn"></button>
      </div>
    </div>
    <div class="results-grid" id="searchResultsGrid"></div>
  </div>
</div>

<!-- ===== App 详情页 ===== -->
<div class="view" id="viewDetail">
  <div class="container">
    <div class="back-row">
      <button class="btn ghost sm" id="backBtn">← <span data-i18n="back"></span></button>
    </div>
    <div id="detailLoading" class="detail-loading" style="display:none"><span class="loading"></span><span data-i18n="loadingApp"></span></div>
    <div id="detailBody" style="display:none">
      <div class="detail-head">
        <div class="app-card">
          <img id="appIcon" src="" alt="">
          <div class="info">
            <h2 id="appName"></h2>
            <div class="dev" id="appDev"></div>
            <div class="badges" id="appBadges"></div>
            <div class="app-desc" id="appDesc"></div>
          </div>
        </div>
        <div class="toolbar">
          <button class="btn store" id="appStoreBtn" style="display:none" data-i18n="storeBtn"></button>
          <button class="btn" id="addWatchBtn" data-i18n="addWatch"></button>
          <button class="btn" id="watchCfgBtn" data-i18n="watchCfg"></button>
          <button class="btn" id="familyBtn" data-i18n="familyTable"></button>
          <button class="btn" id="settingsBtn" data-i18n="settings"></button>
          <button class="btn" id="exportBtn" data-i18n="export"></button>
        </div>
      </div>

      <div class="mode-tabs">
        <button data-mode="iap" class="active"><span data-i18n="iapMode"></span> <span class="count" id="iapCount">0</span></button>
        <button data-mode="app" data-i18n="appMode"></button>
      </div>

      <div class="offer-search" id="offerSearchBar" style="display:none">
        <input id="offerSearch" data-i18n-attr="placeholder" data-i18n="offerSearchPlaceholder">
        <span class="hit" id="offerHit"></span>
      </div>

      <div class="offer-bar" id="offerBar" style="display:none"></div>

      <div id="modeDesc" style="display:none"></div>

      <div class="stats" id="stats"></div>

      <div class="filter-bar">
        <input id="tableFilter" data-i18n-attr="placeholder" data-i18n="tableFilterPlaceholder">
        <select id="convertCurrency">
          <option value="" data-i18n="convertNone"></option>
          <option value="USD">USD</option>
          <option value="CNY" selected>CNY</option>
          <option value="EUR">EUR</option>
          <option value="JPY">JPY</option>
        </select>
        <span id="progressText"></span>
        <div class="progress"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
        <button class="btn sm ghost" id="refreshPricesBtn" style="display:none" data-i18n="refreshPrices"></button>
        <button class="btn sm" id="retryFailBtn" style="display:none"></button>
      </div>

      <div class="table-wrap">
        <table id="priceTable">
          <thead>
            <tr>
              <th data-sort="country" data-i18n="colCountry"></th>
              <th data-sort="rawPrice" data-i18n="colRawPrice"></th>
              <th data-sort="cnyPrice" class="sorted" data-arrow="↑" data-i18n="colConverted"></th>
              <th data-sort="vsLow" data-i18n="colVsLow"></th>
              <th data-sort="period" data-i18n="colPeriod"></th>
              <th data-i18n="colName"></th>
              <th data-i18n="colStatus"></th>
            </tr>
          </thead>
          <tbody id="priceBody"></tbody>
        </table>
      </div>

      <div class="chart-panel" id="chartPanel" style="display:none">
        <div class="head">
          <h4 data-i18n="chartTitle"></h4>
          <span class="sub" id="chartSub" data-i18n="chartHint"></span>
        </div>
        <div id="chartContent"></div>
        <div class="chart-legend" id="chartLegend"></div>
      </div>

      <div class="shot-strip" id="shotStrip" style="display:none"></div>

      <div class="about-panel" id="aboutPanel" style="display:none">
        <h4 data-i18n="aboutApp"></h4>
        <div class="about-text" id="aboutText"></div>
        <button class="btn ghost sm" id="aboutExpand" style="display:none"></button>
      </div>

      <div class="info-grid" id="infoGrid" style="display:none"></div>
    </div>
    <div id="detailError" class="detail-loading" style="display:none"></div>
  </div>
</div>

<!-- ===== 多选浮动条 ===== -->
<div class="multi-bar" id="multiBar">
  <div class="info"><span data-i18n="selectedN"></span> <span id="multiCount">0</span></div>
  <button class="btn primary" id="openMultiCompareBtn" data-i18n="multiCompare"></button>
</div>

<!-- ===== 登录 / 注册弹窗 ===== -->
<div class="modal-bg" id="loginModal">
  <div class="modal narrow">
    <div class="login-mark"><span class="mark-tile"><svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-linecap="round"><path d="M46.74 31.05A17 17 0 1 1 42.02 21.98" stroke-width="4.4"/><ellipse cx="30" cy="34" rx="7" ry="17" stroke-width="2.6" opacity=".35"/><path d="M13.5 34h33" stroke-width="2.6" opacity=".35"/></g><path d="M13 47 26 38 33 42 49.5 20" fill="none" stroke="var(--accent)" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="52" cy="16.5" r="4.4" fill="var(--accent)"/></svg></span></div>
    <h3 id="authTitle"></h3>
    <p class="desc" id="authDesc"></p>
    <label class="field"><span data-i18n="username"></span>
      <input id="loginUser" autocomplete="username"></label>
    <label class="field"><span data-i18n="password"></span>
      <input id="loginPass" type="password" autocomplete="current-password"></label>
    <div class="login-err" id="loginErr"></div>
    <div class="modal-actions" style="border-top:none;padding-top:0;margin-top:8px">
      <button class="btn" id="loginCancel" data-i18n="cancel"></button>
      <button class="btn primary" id="loginSubmit"></button>
    </div>
    <div class="auth-switch"><a id="authSwitchLink"></a></div>
  </div>
</div>

<!-- ===== 修改账号(用户名/密码) ===== -->
<div class="modal-bg" id="accountModal">
  <div class="modal narrow">
    <h3 data-i18n="accountTitle"></h3>
    <div class="field"><span data-i18n="oldPassword"></span>
      <input id="accOldPass" type="password" autocomplete="current-password"></div>
    <div class="field"><span data-i18n="newPassword"></span>
      <input id="accNewPass" type="password" autocomplete="new-password">
      <div class="hint" data-i18n="pwdHint"></div></div>
    <div class="form-label" style="margin-top:14px" data-i18n="changeUsername"></div>
    <div class="field"><span data-i18n="username"></span>
      <input id="accNewName" autocomplete="username"></div>
    <div class="login-err" id="accErr"></div>
    <div class="modal-actions">
      <button class="btn" id="accCancel" data-i18n="cancel"></button>
      <button class="btn primary" id="accSave" data-i18n="save"></button>
    </div>
  </div>
</div>

<!-- ===== 重置密码(管理员) ===== -->
<div class="modal-bg" id="pwdModal">
  <div class="modal narrow">
    <h3 id="pwdModalTitle"></h3>
    <div class="field"><span data-i18n="newPassword"></span>
      <input id="pwdModalInput" type="password" autocomplete="new-password">
      <div class="hint" data-i18n="pwdHint"></div></div>
    <div class="login-err" id="pwdModalErr"></div>
    <div class="modal-actions">
      <button class="btn" id="pwdModalCancel" data-i18n="cancel"></button>
      <button class="btn primary" id="pwdModalOk" data-i18n="save"></button>
    </div>
  </div>
</div>

<!-- ===== 用户管理 (仅管理员) ===== -->
<div class="modal-bg" id="adminModal">
  <div class="modal">
    <div class="head-row">
      <h3 data-i18n="userMgmt"></h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <label class="switch-line"><span data-i18n="publicApiAccess"></span><span class="switch"><input type="checkbox" id="requireApiKey"><span class="slider"></span></span></label>
        <label class="switch-line"><span data-i18n="allowRegister"></span><span class="switch"><input type="checkbox" id="allowRegister"><span class="slider"></span></span></label>
      </div>
    </div>
    <div class="admin-list" id="adminUserList"></div>
    <div class="form-label" data-i18n="adminAddUser" style="margin-top:16px;margin-bottom:0"></div>
    <div class="admin-create">
      <input id="newUserName" data-i18n-attr="placeholder" data-i18n="username">
      <input id="newUserPass" type="password" data-i18n-attr="placeholder" data-i18n="password">
      <select id="newUserRole">
        <option value="user" data-i18n="roleUser"></option>
        <option value="admin" data-i18n="roleAdmin"></option>
      </select>
      <button class="btn sm primary" id="createUserBtn" data-i18n="createUser"></button>
    </div>
    <div class="modal-actions">
      <button class="btn primary" id="adminClose" data-i18n="close"></button>
    </div>
  </div>
</div>

<!-- ===== 地区设置 ===== -->
<div class="modal-bg" id="settingsModal">
  <div class="modal">
    <h3 data-i18n="pickRegions"></h3>
    <div class="bar-row">
      <button class="btn sm" id="presetCommon" data-i18n="presetCommon"></button>
      <button class="btn sm" id="presetAll" data-i18n="presetAll"></button>
      <button class="btn sm" id="presetNone" data-i18n="presetNone"></button>
      <button class="btn sm" id="presetAsia" data-i18n="presetAsia"></button>
      <button class="btn sm" id="presetEU" data-i18n="presetEU"></button>
      <button class="btn sm" id="presetAmericas" data-i18n="presetAmericas"></button>
      <input id="countryFilter" data-i18n-attr="placeholder" data-i18n="filterPlaceholder">
    </div>
    <div class="country-grid" id="countryGrid"></div>
    <div class="modal-actions">
      <button class="btn" id="settingsCancel" data-i18n="cancel"></button>
      <button class="btn primary" id="settingsSave" data-i18n="saveAndQuery"></button>
    </div>
  </div>
</div>

<!-- ===== 家族大表 ===== -->
<div class="modal-bg" id="familyModal">
  <div class="modal wide">
    <div class="head-row">
      <h3 data-i18n="familyTableTitle"></h3>
      <div class="bar-row" style="margin:0">
        <select id="familyConvert">
          <option value="CNY" selected>CNY</option>
          <option value="USD">USD</option>
          <option value="EUR">EUR</option>
          <option value="JPY">JPY</option>
        </select>
        <button class="btn" id="familyExportBtn" data-i18n="export"></button>
      </div>
    </div>
    <div class="desc" id="familyDesc"></div>
    <div class="family-table-wrap" id="familyTableWrap"></div>
    <div class="modal-actions">
      <button class="btn primary" id="familyClose" data-i18n="close"></button>
    </div>
  </div>
</div>

<!-- ===== 多 App 对比 - 选 offer ===== -->
<div class="modal-bg" id="multiPickerModal">
  <div class="modal wide">
    <h3 data-i18n="multiPickerTitle"></h3>
    <div class="desc" data-i18n="multiPickerHint"></div>
    <div class="multi-app-picker" id="multiAppPicker"></div>
    <div class="modal-actions">
      <button class="btn" id="multiPickerCancel" data-i18n="cancel"></button>
      <button class="btn primary" id="multiPickerOK" data-i18n="compareNow" disabled>0/0</button>
    </div>
  </div>
</div>

<!-- ===== 多 App 对比 - 结果 ===== -->
<div class="modal-bg" id="multiCompareModal">
  <div class="modal wide">
    <div class="head-row">
      <h3 data-i18n="multiCompareTitle"></h3>
      <div class="bar-row" style="margin:0">
        <select id="multiConvert">
          <option value="CNY" selected>CNY</option>
          <option value="USD">USD</option>
          <option value="EUR">EUR</option>
          <option value="JPY">JPY</option>
        </select>
        <button class="btn" id="multiExportBtn" data-i18n="export"></button>
      </div>
    </div>
    <div class="family-table-wrap" id="multiCompareTableWrap"></div>
    <div class="modal-actions">
      <button class="btn primary" id="multiCompareClose" data-i18n="close"></button>
    </div>
  </div>
</div>

<!-- ===== 编辑监控 ===== -->
<div class="modal-bg" id="watchModal">
  <div class="modal">
    <h3 data-i18n="watchCfgTitle"></h3>
    <p class="desc" data-i18n="watchCfgDesc"></p>
    <div class="form-label" data-i18n="notifyOn"></div>
    <div class="trig-row" id="trigRow">
      <button class="trig-chip" data-trig="drop">📉 <span data-i18n="trigDrop"></span></button>
      <button class="trig-chip" data-trig="raise">📈 <span data-i18n="trigRaise"></span></button>

      <button class="trig-chip" data-trig="remove">⊖ <span data-i18n="trigRemove"></span></button>
    </div>
    <div class="form-label" data-i18n="limitOffers"></div>
    <div class="chk-grid" id="watchOffers"></div>
    <div class="hint" data-i18n="noLimitAll"></div>
    <div class="form-label" data-i18n="limitRegions"></div>
    <div class="chk-grid" id="watchRegions"></div>
    <div class="hint" data-i18n="noLimitAll"></div>
    <div class="modal-actions">
      <button class="btn" id="watchDelete" data-i18n="delWatch" style="display:none"></button>
      <button class="btn" id="watchCancel" data-i18n="cancel"></button>
      <button class="btn primary" id="watchSave" data-i18n="save"></button>
    </div>
  </div>
</div>

<!-- ===== API 接入 ===== -->
<div class="view" id="viewApi">
  <div class="container narrow-page">
    <div class="page-head">
      <div class="page-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg></div>
      <h2 data-i18n="apiTitle"></h2>
      <p class="page-sub" data-i18n="apiSub"></p>
    </div>
    <div class="panel-card">

function toast(msg, ms=1800){ const el=$("toast"); el.textContent=msg; el.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove("show"), ms); }
function fmt(n, cur){ if(n==null||isNaN(n)) return "—"; if(n===0) return t("statusFree"); const dec=["JPY","KRW","VND","IDR","HUF","CLP","COP","ISK","UGX","KZT"].includes(cur)?0:2; return n.toLocaleString(undefined,{minimumFractionDigits:dec,maximumFractionDigits:dec})+(cur?" "+cur:""); }

async function api(path, params){
  const qs = new URLSearchParams(params).toString();
  const headers = { "X-Web-App": "1" };
  if (state.token) headers["X-Auth-Token"] = state.token;
  const r = await fetch(`/atlas/${path}?${qs}`, { headers });
  if(!r.ok){
    if (r.status === 401) await apiAuthHint(r);
    throw new Error(`HTTP ${r.status}`);
  }
  return r.json();
}
/* 数据接口被「接口需密钥」拦截时:提示并引导登录(15s 内只弹一次,防并发轰炸) */
async function apiAuthHint(r){
  try{ const d = await r.json(); if (!d || d.error !== "api_key_required") return; }
  catch(_){ return; }
  if (authUser) return;
  const now = Date.now();
  if (!apiAuthHint._t || now - apiAuthHint._t > 15000){
    apiAuthHint._t = now;
    toast(t("apiNeedAuth"));
    openLogin();
  }
}
async function pool(items, worker, conc=6, onProg){
  let done=0, i=0; const out=[];
  const runners = Array(Math.min(conc, items.length)).fill(0).map(async ()=>{
    while(true){
      const idx = i++; if(idx>=items.length) return;
      try{ out[idx] = await worker(items[idx]); }catch(e){ out[idx] = {error:e.message}; }
      done++; onProg?.(done, items.length);
    }
  });
  await Promise.all(runners);
  return out;
}

async function loadFx(){

function convert(amount, from, to, rates){
  if(amount==null) return null;
  if(from===to) return amount;
  const fromUSD = from==="USD" ? 1 : (rates[from] ? 1/rates[from] : null);
  const toRate = to==="USD" ? 1 : rates[to];
  if(fromUSD==null || toRate==null) return null;
  return amount * fromUSD * toRate;
}

async function postJSON(path, body){
  const r = await fetch("/atlas/" + path, {
    method:"POST",
    headers:{ "Content-Type":"application/json", ...(state.token ? {"X-Auth-Token":state.token} : {}) },
    body: JSON.stringify(body || {}),
  });
  return r.json();
}

async function initAuth(){
  if (!state.token){ authUser = null; return; }
  try{
    const r = await fetch("/atlas/me", { headers:{ "X-Auth-Token": state.token } });
    const d = await r.json();
    if (d.ok) authUser = { name:d.username, role:d.role || "user", mustChange: !!d.must_change };
    else { state.token = null; save(); authUser = null; }
  }catch(e){ authUser = null; }
}
function authErrText(code){

  const map = {

    user_exists: t("userTaken"),
    password_short: t("pwdShort"),
    bad_username: t("badUsername"),
    register_disabled: t("regDisabled"),
    cannot_modify_self: t("cannotOpSelf"),
    last_admin: t("lastAdmin"),
  };
  return map[code] || t("regFail");
}

  const u = $("loginUser").value.trim(), p = $("loginPass").value;
  if (!u || !p) return;
  $("loginSubmit").disabled = true;
  $("loginErr").textContent = "";
  try{
    const d = await postJSON(authMode === "register" ? "register" : "login", { username:u, password:p });

async function submitAccount(){
  const old = $("accOldPass").value, np = $("accNewPass").value, nn = $("accNewName").value.trim();
  const err = m => { $("accErr").textContent = m; };
  if (!old) return err(t("needOldPwd"));
  if (!np && (!nn || nn === authUser.name)) return err(t("nothingChanged"));
  if (np && np.length < 6) return err(t("pwdShort"));
  try{
    if (np){
      const d = await postJSON("password", { old_password: old, new_password: np });
      if (!d.ok) return err(authErrText(d.error));
    }
    if (nn && nn !== authUser.name){
      // 若同时改了密码,需用新密码验证
      const d = await postJSON("username", { username: nn, password: np || old });
      if (!d.ok) return err(authErrText(d.error));
      state.token = d.token; save(); authUser.name = nn;
    }
    forcePwd = false;
    $("accountModal").classList.remove("show");
    toast(t("accountSaved"));
    updateAuthUI();
  }catch(e){ err(t("netError")); }
}

  if (location.hash === h){ route(); return; }
  routeStack.push(location.hash);
  location.hash = h;
}
function goBack(){
  const prev = routeStack.pop();
  if (prev !== undefined) location.hash = prev;
  else location.hash = "#/";
}
async function route(){
  const seq = ++routeSeq;
  const h = location.hash || "#/";
  const mApp = h.match(/^#\/app\/(\d+)/);
  const mSearch = h.match(/^#\/search(?:\?(.*))?$/);
  if (mApp){
    await showDetail(mApp[1], seq);
  } else if (mSearch){
    const qs = new URLSearchParams(mSearch[1] || "");
    showSearch(qs.get("q") || "");
  } else if (h === "#/api"){
    showApi();
  } else if (h === "#/notify"){
    showNotify();
  } else {
    showHome();
  }
}

/* ---- 缓存秒开：用上次保存的结果先渲染，后台再刷新 ---- */
function tryRenderFromCache(appId){
  const c = state.iapCache[String(appId)];
  if (!c || !c.offers || !c.offers.length) return false;
  allOffers = c.offers.map(o=>({ ...o, prices: { ...o.prices } }));
  allOffersFiltered = allOffers;
  if (!allOffers.find(o=>o.offerKey===currentOfferKey)) currentOfferKey = null;
  if (!currentOfferKey){
    const minPrice = o => Math.min(...Object.values(o.prices).filter(p=>p.price>0)
      .map(p=>convert(p.price, p.currency, "CNY", state.fxRates) ?? Infinity), Infinity);
    const ranked = [...allOffers].sort((a,b)=>{
      const score = o => (o.isSubscription?1000:0)
                      + (o.period==="P1M"?500:o.period==="P1Y"?100:0)
                      + Math.min(Object.keys(o.prices).length, 100);
      if (score(b) !== score(a)) return score(b) - score(a);
      return minPrice(a) - minPrice(b);
    });
    currentOfferKey = ranked[0].offerKey;
  }
  $("iapCount").textContent = allOffers.length;
  $("offerSearchBar").style.display = "flex";
  renderOfferBar();
  renderForOffer();
  return true;
}
function tryRenderCachedAppPrice(appId){
  const c = state.appPriceCache[String(appId)];
  if (!c || !c.rows || !c.rows.length) return false;
  appPriceResults = c.rows.map(r=>({ ...r }));
  renderTable(appPriceResults);
  renderStats(appPriceResults, t("appMode"));
  $("offerBar").style.display = "none";
  $("offerSearchBar").style.display = "none";
  $("modeDesc").style.display = "block";
  $("modeDesc").textContent = t("appPriceDesc");
  return true;
}

/* ---- 应用本身价格 ---- */
async function runAppPrice(countries){
  const app = currentApp, seq = routeSeq;  // 竞态防护
  appPriceResults = [];
  const onProg = (d,ttl)=>{ $("progressBar").style.width=(d/ttl*100).toFixed(0)+"%"; $("progressText").textContent=`${d}/${ttl}`; };
  const worker = async cc=>{
    try{
      const d = await api("lookup", { id: app.trackId, country: cc });
      if (!d.resultCount) return { country: cc, ok:false, reason:"not_listed" };
      const r = d.results[0];
      return { country: cc, ok:true, price:r.price, currency:r.currency, formattedPrice:r.formattedPrice, trackName:r.trackName };
    }catch(e){ return { country: cc, ok:false, reason:"network" }; }
  };
  let results = await pool(countries, worker, 6, onProg);
  const failedCC = results.filter(r=>r.ok===false && r.reason==="network").map(r=>r.country);
  if (failedCC.length){
    $("progressText").textContent = t("retrying", {n: failedCC.length});
    const retry = await pool(failedCC, worker, 3);
    const byCC = {}; retry.forEach(r=>{ byCC[r.country] = r; });
    results = results.map(r=> (r.ok===false && r.reason==="network" && byCC[r.country]) ? byCC[r.country] : r);
  }
  if (currentApp !== app || seq !== routeSeq) return;  // 已切换，本次结果作废
  appPriceResults = results.map(r=>{
    if(!r.ok) return r;
    return { ...r, cnyPrice: convert(r.price, r.currency, "CNY", state.fxRates), usdPrice: convert(r.price, r.currency, "USD", state.fxRates) };
  });
  updateRetryBtn(appPriceResults);
  // 存入本地缓存，下次进入秒开
  state.appPriceCache[String(app.trackId)] = { ts: Date.now(), rows: appPriceResults };
  const priceCacheKeys = Object.keys(state.appPriceCache);
  if (priceCacheKeys.length > 20){
    priceCacheKeys.sort((a,b)=>state.appPriceCache[a].ts - state.appPriceCache[b].ts)
      .slice(0, priceCacheKeys.length - 20)
      .forEach(k=>delete state.appPriceCache[k]);
  }
  save();
  $("offerBar").style.display = "none";
  $("offerSearchBar").style.display = "none";
  $("modeDesc").style.display = "block";
  $("modeDesc").textContent = t("appPriceDesc");
  renderTable(appPriceResults);
  renderStats(appPriceResults, t("appMode"));
}

/* ---- 内购订阅价格 ----
 * 对齐主键：iapId (Apple salableAdamId 全球唯一) + period
 * 显示名优先取英文区 canonical，兜底用首条
 */
async function runIAP(countries){
  const app = currentApp, seq = routeSeq;  // 竞态防护：期间切换页面/App 则丢弃结果
  iapByCountry = {};
  const onProg = (d,ttl)=>{ $("progressBar").style.width=(d/ttl*100).toFixed(0)+"%"; $("progressText").textContent=`${d}/${ttl}`; };
  const worker = async cc=>{
    try{
      const d = await api("iap", { id: app.trackId, country: cc });
      return { ...d, country: cc };
    }catch(e){ return { country: cc, ok:false, reason:"network" }; }
  };
  let results = await pool(countries, worker, 5, onProg);
  // 限速/网络抖动导致失败的地区自动补查一轮（后端有退避重试，通常能救回大部分）
  const failedCC = results.filter(r=>r.ok===false && r.reason==="network").map(r=>r.country);
  if (failedCC.length){
    $("progressText").textContent = t("retrying", {n: failedCC.length});
    const retry = await pool(failedCC, worker, 3);
    const byCC = {}; retry.forEach(r=>{ byCC[r.country] = r; });
    results = results.map(r=> (r.ok===false && r.reason==="network" && byCC[r.country]) ? byCC[r.country] : r);
  }
  if (currentApp !== app || seq !== routeSeq) return;  // 已切换，本次结果作废
  results.forEach(r=>{ iapByCountry[r.country] = r; });
  updateRetryBtn(results);

  const map = {};
  results.forEach(r=>{
    if (!r.ok || !r.iaps) return;
    r.iaps.forEach(iap=>{
      const skuId = iap.iapId || iap.offerName || ("unknown_"+Math.random());
      const key = skuId + "::" + (iap.period || "ONCE");
      if (!map[key]){
        map[key] = {
          offerKey: key,
          iapId: iap.iapId,
          offerName: iap.offerName,
          name: iap.name,
          groupName: iap.groupName,
          groupRank: iap.groupRank ?? 999,
          period: iap.period,
          isSubscription: iap.isSubscription,
          prices: {},
        };
      }
      map[key].prices[r.country] = {
        price: iap.price, currency: iap.currencyCode, formatted: iap.priceFormatted,
        localizedName: iap.name, localizedGroupName: iap.groupName,
      };
    });
  });
  const ENGLISH_CC = ["US","GB","CA","AU","IE","SG","HK","NZ","ZA","IN","PH","MY"];
  Object.values(map).forEach(off => {
    for (const cc of ENGLISH_CC){
      if (off.prices[cc] && off.prices[cc].localizedName){
        off.name = off.prices[cc].localizedName;
        if (off.prices[cc].localizedGroupName) off.groupName = off.prices[cc].localizedGroupName;
        return;
      }
    }
    for (const cc in off.prices){
      if (off.prices[cc].localizedName){ off.name = off.prices[cc].localizedName; break; }
    }
    off.groupName = off.groupName || (LANG==="en"?"Other":"其他");
  });
  allOffers = Object.values(map).sort((a,b)=>{
    if (a.groupName !== b.groupName) return (a.groupName||"").localeCompare(b.groupName||"");
    if (a.groupRank !== b.groupRank) return a.groupRank - b.groupRank;
    const order = ["P1W","P1M","P2M","P3M","P6M","P1Y","ONCE"];
    return order.indexOf(a.period||"ONCE") - order.indexOf(b.period||"ONCE");
  });
  allOffersFiltered = allOffers;
  $("iapCount").textContent = allOffers.length;

  if (!allOffers.length){
    $("offerSearchBar").style.display = "none";
    $("offerBar").style.display = "none";
    $("modeDesc").style.display = "block";
    $("modeDesc").textContent = t("noOffers");
    $("priceBody").innerHTML = "";
    $("stats").innerHTML = "";
    $("chartPanel").style.display = "none";
    return;
  }

  if (!currentOfferKey || !allOffers.find(o=>o.offerKey===currentOfferKey)){
    // 默认选「订阅 + 月付 + 覆盖国家多」的 offer；同分时优先更便宜的入门档
    const minPrice = o => Math.min(...Object.values(o.prices).filter(p=>p.price>0)
      .map(p=>convert(p.price, p.currency, "CNY", state.fxRates) ?? Infinity), Infinity);
    const ranked = [...allOffers].sort((a,b)=>{
      const score = o => (o.isSubscription?1000:0)
                      + (o.period==="P1M"?500:o.period==="P1Y"?100:0)
                      + Math.min(Object.keys(o.prices).length, 100);
      if (score(b) !== score(a)) return score(b) - score(a);
      return minPrice(a) - minPrice(b);
    });
    currentOfferKey = ranked[0].offerKey;
  }

  saveSnapshot();
  $("offerSearchBar").style.display = "flex";
  renderOfferBar();
  renderForOffer();
}

/* ---- 历史快照保存 + 缓存 ---- */
function saveSnapshot(){
  if (!currentApp || !allOffers.length) return;
  const appId = String(currentApp.trackId);
  state.iapCache[appId] = {
    name: currentApp.trackName,
    icon: currentApp.artworkUrl60 || currentApp.artworkUrl100,
    artist: currentApp.artistName,
    offers: allOffers.map(o => ({
      offerKey: o.offerKey, iapId: o.iapId, offerName: o.offerName,
      name: o.name, groupName: o.groupName, period: o.period,
      isSubscription: o.isSubscription,
      prices: o.prices,
    })),
    queriedAt: Date.now(),
  };
  const cutoff = Date.now() - 180 * 86400000;
  allOffers.forEach(o => {
    const k = appId + ":" + o.offerKey;
    state.history[k] = state.history[k] || [];
    const snap = {};
    for (const cc in o.prices) snap[cc] = { p: o.prices[cc].price, c: o.prices[cc].currency };
    const last = state.history[k][state.history[k].length - 1];
    if (!last || JSON.stringify(last.prices) !== JSON.stringify(snap)) {
      state.history[k].push({ ts: Date.now(), prices: snap });
    }
    state.history[k] = state.history[k].filter(s => s.ts >= cutoff).slice(-30);
  });
  // 历史快照限量：最多保留 60 个 key，按最新快照时间淘汰旧的
  const hk = Object.keys(state.history);
  if (hk.length > 60){
    hk.sort((a,b)=>{
      const ha = state.history[a], hb = state.history[b];
      return (hb[hb.length-1]?.ts || 0) - (ha[ha.length-1]?.ts || 0);
    });
    hk.slice(60).forEach(k=>delete state.history[k]);
  }
  save();
}

function renderOfferBar(){
  const q = ($("offerSearch")?.value || "").trim().toLowerCase();
  if (q){
    allOffersFiltered = allOffers.filter(o => {
      const hay = [
        o.name, o.offerName, o.groupName, periodLabel(o.period),
        ...Object.values(o.prices).map(p => p.localizedName).filter(Boolean),
      ].join(" ").toLowerCase();
      return q.split(/\s+/).every(part => hay.includes(part));
    });
  } else {
    allOffersFiltered = allOffers;
  }
  if ($("offerHit")) $("offerHit").textContent = q ? `${allOffersFiltered.length}/${allOffers.length}` : "";

  // 扁平横向条带：所有套餐一排，横向滚动（样式参考主流比价站）
  $("offerBar").innerHTML = allOffersFiltered.map(o=>`
    <div class="offer-chip ${o.offerKey===currentOfferKey?"active":""}" data-key="${esc(o.offerKey)}">
      <span>${esc(o.name||o.offerName||"?")}</span>
      <span class="period">${periodLabel(o.period)}</span>
    </div>`).join("");
  $("offerBar").style.display = "flex";
  const activeChip = $("offerBar").querySelector(".offer-chip.active");
  if (activeChip) try { activeChip.scrollIntoView({ inline:"center", block:"nearest" }); } catch(e) {}
}
function renderForOffer(){
  const offer = allOffers.find(o=>o.offerKey===currentOfferKey);
  if (!offer) return;
  $("modeDesc").style.display = "block";
  const subStr = offer.isSubscription ? t("statusSub") : t("statusOnce");
  $("modeDesc").innerHTML = `${t("productLabel")}: <b>${esc(offer.name)}</b> · ${t("cycleLabel")} <b>${periodLabel(offer.period)}</b> · ${subStr} · ${Object.keys(offer.prices).length} ${t("countriesAvail")}`;
  const hasCountryData = Object.keys(iapByCountry).length > 0;  // 缓存秒开时为空，直接用 offer 内价格
  const rows = state.selectedCountries.map(cc=>{
    const cd = iapByCountry[cc];
    if (hasCountryData && cd && cd.ok === false) return { country: cc, ok:false, reason: cd.reason };
    const p = offer.prices[cc];
    if (!p) return { country: cc, ok:false, reason: hasCountryData ? "not_in_region" : "not_listed" };
    return {
      country: cc, ok:true,
      price: p.price, currency: p.currency, formattedPrice: p.formatted,
      trackName: p.localizedName,
      cnyPrice: convert(p.price, p.currency, "CNY", state.fxRates),
      usdPrice: convert(p.price, p.currency, "USD", state.fxRates),
      period: offer.period,
    };
  });
  renderTable(rows);
  renderStats(rows, offer.name + " · " + periodLabel(offer.period));
  if (authUser) renderChart(offer);
  else $("chartPanel").style.display = "none";
}

function renderTable(rows){

  if (convTh) convTh.textContent = t("colConverted") + (convertTo ? " · " + convertTo : "");
  const filter = $("tableFilter").value.toLowerCase();
  let arr = rows.filter(r=>{
    if(!filter) return true;
    return r.country.toLowerCase().includes(filter)
        || nameOf(r.country).toLowerCase().includes(filter)
        || (r.currency||"").toLowerCase().includes(filter);
  });
  const okOnly = arr.filter(r=>r.ok);
  okOnly.sort((a,b)=>{
    let va,vb;
    if(sortKey==="country"){ va=nameOf(a.country); vb=nameOf(b.country); return va.localeCompare(vb)*sortDir; }
    if(sortKey==="rawPrice"){ va=a.price||0; vb=b.price||0; }
    else if(sortKey==="cnyPrice" || sortKey==="vsLow"){ va=a.cnyPrice||Infinity; vb=b.cnyPrice||Infinity; }
    else if(sortKey==="period"){ va=a.period||"Z"; vb=b.period||"Z"; return va.localeCompare(vb)*sortDir; }
    else { va=a[sortKey]||""; vb=b[sortKey]||""; return String(va).localeCompare(String(vb))*sortDir; }
    return (va-vb)*sortDir;
  });
  arr = okOnly;  // 未上架/无数据地区不再展示（覆盖数见统计卡）
  const okPrices = okOnly.filter(r=>r.price>0).map(r=>r.cnyPrice).filter(x=>x!=null);
  const minCny = okPrices.length ? Math.min(...okPrices) : null;
  const maxCny = okPrices.length ? Math.max(...okPrices) : null;
  if (!arr.length){
    $("priceBody").innerHTML = `<tr><td colspan="7" style="border:none"><div class="empty">${t("tableEmpty")}</div></td></tr>`;
    return;
  }
  $("priceBody").innerHTML = arr.map(r=>{
    const isFree = r.price===0;
    let rowCls = "";
    if (!isFree && r.cnyPrice===minCny) rowCls = "row-low";
    else if (!isFree && r.cnyPrice===maxCny) rowCls = "row-high";
    const vsLow = !isFree && minCny ? ((r.cnyPrice/minCny - 1)*100) : 0;
    const convDisp = convertTo ? fmt(convert(r.price, r.currency, convertTo, state.fxRates), convertTo) : "—";
    return `<tr class="${rowCls}">
      <td class="country-cell"><span class="flag">${flagOf(r.country)}</span>${esc(nameOf(r.country))} <span style="color:var(--muted);font-size:11px">·${r.country}</span></td>
      <td class="price-cell">${isFree?`<span class="status free">${t("statusFree")}</span>`:fmt(r.price, r.currency)}</td>
      <td class="price-cell">${isFree?"—":convDisp}</td>
      <td>${isFree?"—":(vsLow===0?`<span style="color:var(--low);font-weight:600">${t("lowest")}</span>`:`<span class="delta ${vsLow>50?'up':''}">+${vsLow.toFixed(0)}%</span>`)}</td>
      <td style="font-size:12px;color:var(--muted)">${periodLabel(r.period)}</td>
      <td style="color:var(--muted);font-size:12px;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.trackName||"")}</td>
      <td>${isFree?`<span class="status free">${t("statusFree")}</span>`:`<span class="status ok">${t("statusPaid")}</span>`}</td>
    </tr>`;
  }).join("");
  document.querySelectorAll("th[data-sort]").forEach(th=>{
    th.classList.toggle("sorted", th.dataset.sort===sortKey);
    th.dataset.arrow = sortDir>0?"↑":"↓";
  });
}

/* ====================== 历史价格折线图 (SVG) ====================== */
const CHART_PALETTE = [
  "#4f8cff","#22c55e","#f59e0b","#ef4444","#a855f7","#06b6d4",
  "#ec4899","#84cc16","#f97316","#14b8a6","#6366f1","#eab308",
];
function renderChart(offer){
  if (!currentApp || !offer || !authUser){ $("chartPanel").style.display = "none"; return; }
  const cur = convertTo || "CNY";
  const sym = CUR_SYMBOL[cur] || "";
  const k = String(currentApp.trackId) + ":" + offer.offerKey;
  const hist = (state.history[k] || []).slice();
  const cutoff = Date.now() - 180*86400000;
  const points = hist.filter(s => s.ts >= cutoff);
  $("chartPanel").style.display = "block";

  if (!points.length){
    $("chartContent").innerHTML = `<div class="empty">${t("chartEmpty")}</div>`;
    $("chartLegend").innerHTML = "";
    return;
  }

  const allCC = new Set();
  points.forEach(s => Object.keys(s.prices).forEach(cc => allCC.add(cc)));
  const cc_list = [...allCC];
  if (Object.keys(chartLegendState).length === 0 || !cc_list.some(cc => chartLegendState[cc])) {
    chartLegendState = {};
    const ranked = cc_list
      .map(cc => {
        const p = offer.prices[cc];
        if (!p) return { cc, v: Infinity };
        return { cc, v: convert(p.price, p.currency, cur, state.fxRates) || Infinity };
      })
      .sort((a,b) => a.v - b.v);
    ranked.slice(0, 5).forEach(x => { chartLegendState[x.cc] = true; });
  }

  const series = {};
  cc_list.forEach(cc => {
    series[cc] = [];
    points.forEach(s => {
      const p = s.prices[cc];
      if (!p) return;
      const v = convert(p.p, p.c, cur, state.fxRates);
      if (v == null) return;
      series[cc].push({ ts: s.ts, v });
    });
  });

  const visibleCC = cc_list.filter(cc => chartLegendState[cc] && series[cc].length > 0);
  if (!visibleCC.length){
    $("chartContent").innerHTML = `<div class="empty">${t("chartNoData")}</div>`;
    renderLegendButtons(cc_list);
    return;
  }
  const yvals = visibleCC.flatMap(cc => series[cc].map(p => p.v));
  const minY = Math.min(...yvals) * 0.92;
  const maxY = Math.max(...yvals) * 1.08;
  const minT = cutoff;
  const maxT = Date.now();

  const W = 880, H = 280, padL = 56, padR = 16, padT = 16, padB = 32;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const xScale = ts => padL + ((ts - minT) / (maxT - minT)) * innerW;
  const yScale = v => padT + (1 - (v - minY) / (maxY - minY)) * innerH;

  const monthTicks = [];
  for (let i = 0; i <= 6; i++){
    const ts = minT + (maxT - minT) * i / 6;
    monthTicks.push({ ts, label: new Date(ts).toLocaleDateString(LANG==="en"?"en-US":"zh-CN", {month:"short", day:"numeric"}) });
  }
  const yTicks = [];
  for (let i = 0; i <= 4; i++){
    const v = minY + (maxY - minY) * i / 4;
    yTicks.push({ v, y: yScale(v) });
  }

  const colorOf = cc => CHART_PALETTE[cc_list.indexOf(cc) % CHART_PALETTE.length];

  let svg = `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  svg += `<g class="chart-axis">`;
  yTicks.forEach(tick => {
    svg += `<line x1="${padL}" y1="${tick.y}" x2="${padL+innerW}" y2="${tick.y}" stroke-width="1"/>`;
    svg += `<text x="${padL-8}" y="${tick.y+3}" text-anchor="end">${sym}${tick.v.toFixed(0)}</text>`;
  });
  monthTicks.forEach(mt => {
    const x = xScale(mt.ts);
    svg += `<text x="${x}" y="${H-padB+18}" text-anchor="middle">${mt.label}</text>`;
  });
  svg += `</g>`;
  visibleCC.forEach(cc => {
    const color = colorOf(cc);
    const pts = series[cc].slice().sort((a,b) => a.ts - b.ts);
    if (!pts.length) return;
    let d = "";
    pts.forEach((p, i) => {
      d += (i===0?"M":"L") + xScale(p.ts).toFixed(1) + "," + yScale(p.v).toFixed(1) + " ";
    });
    svg += `<path class="chart-line" d="${d}" stroke="${color}"/>`;
    pts.forEach(p => {
      svg += `<circle class="chart-dot" cx="${xScale(p.ts).toFixed(1)}" cy="${yScale(p.v).toFixed(1)}" r="4" fill="${color}" data-cc="${cc}" data-ts="${p.ts}" data-v="${p.v.toFixed(2)}"/>`;
    });
  });
  svg += `</svg>`;
  $("chartContent").innerHTML = svg;
  renderLegendButtons(cc_list);

  $("chartContent").querySelectorAll(".chart-dot").forEach(dot => {
    dot.addEventListener("mouseenter", () => {
      const tip = $("chartTooltip");
      const cc = dot.dataset.cc;
      const ts = +dot.dataset.ts;
      const v = +dot.dataset.v;
      tip.innerHTML = `${flagOf(cc)} ${esc(nameOf(cc))} · ${sym}${v.toFixed(2)}<br><span style="color:var(--muted);font-size:10.5px">${new Date(ts).toLocaleString(LANG==="en"?"en-US":"zh-CN")}</span>`;
      tip.style.display = "block";
      const rect = dot.getBoundingClientRect();
      tip.style.left = (rect.left + window.scrollX + 8) + "px";
      tip.style.top = (rect.top + window.scrollY - 50) + "px";
    });
    dot.addEventListener("mouseleave", () => { $("chartTooltip").style.display = "none"; });
  });
}
function renderLegendButtons(cc_list){
  const html = cc_list.map(cc => {
    const color = CHART_PALETTE[cc_list.indexOf(cc) % CHART_PALETTE.length];
    const dim = !chartLegendState[cc];
    return `<span class="chart-legend-item${dim?' dim':''}" data-cc="${cc}">
      <span class="swatch" style="background:${color}"></span>${flagOf(cc)} ${esc(nameOf(cc))}
    </span>`;
  }).join("");
  $("chartLegend").innerHTML = html;
  $("chartLegend").querySelectorAll(".chart-legend-item").forEach(el => {
    el.addEventListener("click", () => {
      const cc = el.dataset.cc;
      chartLegendState[cc] = !chartLegendState[cc];
      const offer = allOffers.find(o => o.offerKey === currentOfferKey);
      if (offer) renderChart(offer);
    });
  });
}

function heatmapBG(ratio){
  const r = Math.round(34 + (239-34)*ratio);
  const g = Math.round(197 + (68-197)*ratio);
  const b = Math.round(94 + (68-94)*ratio);
  return `background:rgba(${r},${g},${b},0.18)`;
}
function renderFamilyTable(){
  if (!allOffers.length) return;
  const cur = $("familyConvert").value || "CNY";
  const offers = allOffers;
  const ccs = state.selectedCountries;
  $("familyDesc").textContent = `${currentApp.trackName} · ${offers.length}${LANG==="en"?" subscriptions":" 个订阅产品"} × ${ccs.length}${LANG==="en"?" regions":" 国"} · ${LANG==="en"?"converted to ":"折算到 "}${cur}`;

  const colStats = offers.map(off => {

      const p = off.prices[cc];
      if (!p || p.price === 0) return null;
      return convert(p.price, p.currency, cur, state.fxRates);
    }).filter(v => v != null);
    return { min: vals.length ? Math.min(...vals) : null, max: vals.length ? Math.max(...vals) : null };
  });

  const rowOrder = ccs.map(cc => {
    const lows = offers.map(off => {
      const p = off.prices[cc];
      if (!p || p.price === 0) return Infinity;
      return convert(p.price, p.currency, cur, state.fxRates) || Infinity;
    });
    return { cc, low: Math.min(...lows) };
  }).sort((a,b) => a.low - b.low)

  let html = `<table class="family-table">
    <thead><tr>
      <th>${t("colCountry")}</th>
      ${offers.map(o => `<th>${esc(o.name)}<span class="small">${periodLabel(o.period)}</span></th>`).join("")}
    </tr></thead><tbody>`;
  rowOrder.forEach(({cc}) => {
    html += `<tr><td><span class="flag">${flagOf(cc)}</span> ${esc(nameOf(cc))}<span class="small">${cc}</span></td>`;
    offers.forEach((off, i) => {
      const p = off.prices[cc];
      if (!p) { html += `<td style="color:var(--muted);text-align:center">—</td>`; return; }
      if (p.price === 0) { html += `<td><span class="status free">${t("statusFree")}</span></td>`; return; }
      const conv = convert(p.price, p.currency, cur, state.fxRates);
      const stat = colStats[i];
      let bg = "";
      if (stat.min != null && stat.max != null && stat.max > stat.min){
        bg = heatmapBG((conv - stat.min) / (stat.max - stat.min));
      } else if (stat.min != null) {
        bg = "background:rgba(34,197,94,0.15)";
      }
      html += `<td style="${bg}">${fmt(conv, cur)}<span class="small">${esc(p.formatted||"")}</span></td>`;
    });
    html += `</tr>`;
  });
  html += `</tbody></table>`;
  $("familyTableWrap").innerHTML = html;

function exportFamilyCSV(){
  if (!currentApp || !allOffers.length) return;
  const cur = $("familyConvert").value || "CNY";
  const offers = allOffers;
  const ccs = state.selectedCountries;
  const headers = ["Country Code", "Country", ...offers.flatMap(o => [
    `${o.name} - ${periodLabel(o.period)} (${cur})`,
    `${o.name} - ${periodLabel(o.period)} (Local)`,
  ])];
  const rows = ccs.map(cc => {
    const row = [cc, nameOf(cc)];
    offers.forEach(off => {
      const p = off.prices[cc];
      if (!p) { row.push("", ""); return; }
      const conv = convert(p.price, p.currency, cur, state.fxRates);
      row.push(conv != null ? conv.toFixed(2) : "", p.formatted || "");
    });
    return row;
  });
  const csv = [headers, ...rows].map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  downloadCSV(csv, `${sanitize(currentApp.trackName)}_family_${dateStr()}.csv`);
  toast(t("csvDone"));
}
function sanitize(s){ return String(s||"").replace(/[^\w\u4e00-\u9fa5]/g,"_"); }
function dateStr(){ return new Date().toISOString().slice(0,10); }
function downloadCSV(csv, name){
  const blob = new Blob(["\ufeff"+csv], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name; a.click();
  URL.revokeObjectURL(a.href);
}

function exportCSV(){
  if (!currentTableData.length){ toast(t("selectApp")); return; }
  const offer = currentMode==="iap" ? allOffers.find(o=>o.offerKey===currentOfferKey) : null;
  const headers = ["Country Code","Country","Currency","Local Price","Formatted","CNY Equiv","USD Equiv","Period","Localized Name","Status"];

    r.country, nameOf(r.country), r.currency||"", r.price??"", r.formattedPrice||"",
    r.cnyPrice?.toFixed(2)||"", r.usdPrice?.toFixed(2)||"",
    r.period||"", r.trackName||"", r.price===0?"Free":"Paid",
  ] : [r.country, nameOf(r.country),"","","","","","","",reasonLabel(r)]);
  const csv = [headers, ...rows].map(row=>row.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  const offerLabel = offer ? "_"+sanitize(offer.name) : "";
  a.download = `${sanitize(currentApp.trackName)}${offerLabel}_${dateStr()}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast(t("csvDone"));
}

function copyText(text){
  const done = ()=>toast(t("copyDone"));
  if (navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done){
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch(e){}
  ta.remove();
}

/* 调用统计柱状图(近 30 天) */
function renderStatChart(days){
  const wrap = $("statChartWrap");
  if (!days.length || !days.some(d=>d.count)){
    wrap.innerHTML = `<div class="empty">${t("statEmpty")}</div>`;
    return;
  }
  const max = Math.max(5, ...days.map(d=>d.count));
  const W=860, H=250, padL=44, padB=30, padT=14;
  const plotH = H - padT - padB, iw = (W - padL - 12) / 30;
  const y = v => padT + plotH * (1 - v / max);
  let grid = "", labels = "", bars = "";
  for (let g = 0; g <= 4; g++){
    const v = Math.round(max * g / 4);
    grid += `<line x1="${padL}" y1="${y(v)}" x2="${W-12}" y2="${y(v)}" class="cg"/>` +
            `<text x="${padL-8}" y="${y(v)+4}" text-anchor="end" class="ct">${v}</text>`;
  }
  days.forEach((d, i)=>{
    const bx = padL + i * iw + iw * 0.2, bw = iw * 0.6;
    if (d.count){
      bars += `<rect x="${bx.toFixed(1)}" y="${y(d.count).toFixed(1)}" width="${bw.toFixed(1)}" height="${(plotH*d.count/max).toFixed(1)}" rx="3" class="cbar" data-i="${i}"/>`;
    }
    if (i % 5 === 0 || i === 29){
      const dd = new Date(d.date + "T00:00:00");
      const lb = LANG === "en" ? `${dd.getMonth()+1}/${dd.getDate()}` : `${dd.getMonth()+1}月${dd.getDate()}日`;
      labels += `<text x="${(bx+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle" class="ct">${lb}</text>`;
    }
  });
  wrap.innerHTML = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${grid}${labels}${bars}</svg>`;
  const tt = $("chartTooltip");
  wrap.querySelectorAll(".cbar").forEach(r=>{
    r.addEventListener("mousemove", e=>{
      const d = days[+r.dataset.i];
      tt.innerHTML = `<b>${d.date.slice(5).replace("-", "月")}日</b><br>${d.count} ${t("statCalls")}` +
        (d.count ? `<br>${t("statAvg")}: ${d.avg_ms}ms` : "");
      tt.style.display = "block";
      tt.style.left = (e.pageX + 14) + "px";
      tt.style.top = (e.pageY - 12) + "px";
    });
    r.addEventListener("mouseleave", ()=>{ tt.style.display = "none"; });
  });
}
