  box.innerHTML = ["tg","bark","http"].map(tp=>{
    const m = CH_META[tp], cfg = notifyChannels[tp] || {};
    const on = tp==="tg" ? !!cfg.bot_token : tp==="bark" ? !!cfg.device_key : !!cfg.url;
    return `<div class="ch-pick-card" data-chconf="${tp}">
      <span class="ch-pick-ico">${m.icon}</span>
      <span class="nm" style="font-size:12.5px;font-weight:600">${m.name}${m.ios?' <em>iOS</em>':""}</span>
      ${cfg.name?`<span style="font-size:11px;color:var(--muted)">${esc(cfg.name)}</span>`:""}
      <span class="ch-badge ${on?'ok':'off'}">${t(on?'chOn':'chOff')}</span></div>`;
  }).join("");
  box.querySelectorAll("[data-chconf]").forEach(b=>b.addEventListener("click",()=>openChannelModal(b.dataset.chconf)));
}
function openChannelModal(type){
  chType = type || "tg";
  const cfg = notifyChannels[chType] || {};
  const on = chType==="tg" ? !!cfg.bot_token : chType==="bark" ? !!cfg.device_key : !!cfg.url;
  $("chModalTitle").textContent = `${t("chConfig")} · ${CH_META[chType].name}`;
  $("chTestBtn").style.display = on ? "" : "none";
  $("channelModal").classList.add("show");
  renderChForm();
}
function chField(label, id, val){
  return `<div class="field"><span>${label}</span><input id="${id}" value="${esc(val||"")}"></div>`;
}
function renderChForm(){
  const cfg = notifyChannels[chType] || {};
  let html;
  const nameField = chField(t("chNameLbl"),"chName",cfg.name);
  if (chType==="tg"){
    html = chField(t("tgTokenLbl"),"chTgToken",cfg.bot_token)
         + chField(t("tgChatLbl"),"chTgChat",cfg.chat_id)
         + chField(`${t("tgGroupLbl")}（${t("optional")}）`,"chTgGroup",cfg.group_id);
  } else if (chType==="bark"){
    html = chField(t("barkKeyLbl"),"chBarkKey",cfg.device_key)
         + chField(`${t("barkSrvLbl")}（${t("optional")}）`,"chBarkSrv",cfg.server);
  } else {
    html = nameField
         + chField("Webhook URL","chHttpUrl",cfg.url);
  }
  $("chForm").innerHTML = html;
  $("chFormHint").textContent = t(CH_META[chType].hintKey);
}
async function saveChannel(){
  const tp = chType; let config;
  if (tp==="tg") config = {bot_token:$("chTgToken").value.trim(), chat_id:$("chTgChat").value.trim(), group_id:$("chTgGroup").value.trim()};
  else if (tp==="bark") config = {device_key:$("chBarkKey").value.trim(), server:$("chBarkSrv").value.trim()};
  else config = {name:$("chName").value.trim(), url:$("chHttpUrl").value.trim()};
  const r = await postJSON("channels/save", {type:tp, config});
  if (r.ok){ toast(t("saved")); $("channelModal").classList.remove("show"); showNotify(); }
  else toast(authErrText(r.error));
}
$("chCancel").addEventListener("click", ()=>$("channelModal").classList.remove("show"));
$("chSave").addEventListener("click", saveChannel);
$("chTestBtn").addEventListener("click", async ()=>{
  const r = await postJSON("channels/test", {type: chType});
  toast(r.ok ? t("chTestOk") : t("chTestFail"));
});
$("channelModal").addEventListener("click", e=>{ if(e.target.id==="channelModal") e.target.classList.remove("show"); });

$("appStoreBtn").addEventListener("click", ()=>{
  if (currentApp) window.open("https://apps.apple.com/us/app/id" + currentApp.trackId, "_blank");
});

/* 登录 / 注册 / 用户管理 */
$("navLoginBtn").addEventListener("click", ()=>openLogin("login"));
$("authSwitchLink").addEventListener("click", ()=>openLogin(authMode === "login" ? "register" : "login"));
$("logoutBtn").addEventListener("click", doLogout);
$("navAdminBtn").addEventListener("click", openAdmin);
$("accCancel").addEventListener("click", ()=>$("accountModal").classList.remove("show"));
$("accSave").addEventListener("click", submitAccount);
$("accountModal").addEventListener("click", e=>{
  if (e.target.id === "accountModal"){
    if (forcePwd){ toast(t("mustChangePwd")); return; }
    e.target.classList.remove("show");
  }
});
$("pwdModalOk").addEventListener("click", ()=>{
  if (pwdModalCb && pwdModalCb($("pwdModalInput").value) !== false)
    $("pwdModal").classList.remove("show");
});
$("pwdModalCancel").addEventListener("click", ()=>$("pwdModal").classList.remove("show"));
$("pwdModalInput").addEventListener("keydown", e=>{ if(e.key==="Enter") $("pwdModalOk").click(); });
$("pwdModal").addEventListener("click", e=>{ if(e.target.id==="pwdModal") e.target.classList.remove("show"); });
document.addEventListener("keydown", e=>{
  if (e.key !== "Escape") return;
  document.querySelectorAll(".modal-bg.show").forEach(m=>{
    if (m.id === "accountModal" && forcePwd) return; // 首登强制改密不可跳过
    m.classList.remove("show");
  });
});
$("adminClose").addEventListener("click", ()=>$("adminModal").classList.remove("show"));
$("adminModal").addEventListener("click", e=>{ if(e.target.id==="adminModal") e.target.classList.remove("show"); });
$("allowRegister").addEventListener("change", e=>adminAction("config/set", { allow_register: e.target.checked }));
$("requireApiKey").addEventListener("change", e=>adminAction("config/set", { require_api_key: !e.target.checked }));
$("createUserBtn").addEventListener("click", async ()=>{
  const u = $("newUserName").value.trim(), p = $("newUserPass").value, role = $("newUserRole").value;
  if (!u || !p) return;
  const d = await postJSON("users/create", { username:u, password:p, role });
  if (!d.ok){ toast(authErrText(d.error)); return; }
  $("newUserName").value = ""; $("newUserPass").value = "";
  toast(t("opDone"));
  reloadAdmin();
});
$("loginCancel").addEventListener("click", ()=>$("loginModal").classList.remove("show"));
$("loginSubmit").addEventListener("click", submitAuth);
$("loginPass").addEventListener("keydown", e=>{ if(e.key==="Enter") submitAuth(); });
$("loginUser").addEventListener("keydown", e=>{ if(e.key==="Enter") $("loginPass").focus(); });
$("loginModal").addEventListener("click", e=>{ if(e.target.id==="loginModal") e.target.classList.remove("show"); });

/* 地区设置 */
$("settingsCancel").addEventListener("click", ()=>$("settingsModal").classList.remove("show"));
$("settingsSave").addEventListener("click", ()=>{
  const checked = [...document.querySelectorAll("#countryGrid input:checked")].map(cb=>cb.value);
  if (!checked.length){ toast(t("selectOne")); return; }
  state.selectedCountries = checked; save();
  $("settingsModal").classList.remove("show");
  if (currentApp && $("viewDetail").style.display !== "none") runQuery();
});
$("countryFilter").addEventListener("input", debounce(renderCountryGrid, 200));
$("presetCommon").addEventListener("click", ()=>applyPreset(c=>DEFAULT_PICK.includes(c[0])));
$("presetAll").addEventListener("click", ()=>applyPreset(_=>true));
$("presetNone").addEventListener("click", ()=>applyPreset(_=>false));
$("presetAsia").addEventListener("click", ()=>applyPreset(c=>c[3]==="Asia"||c[3]==="ME"));
$("presetEU").addEventListener("click", ()=>applyPreset(c=>c[3]==="EU"));
$("presetAmericas").addEventListener("click", ()=>applyPreset(c=>c[3]==="Americas"));
$("settingsModal").addEventListener("click", e=>{ if(e.target.id==="settingsModal") e.target.classList.remove("show"); });

/* 表格筛选 / 排序 / 换算 */
$("convertCurrency").addEventListener("change", e=>{ convertTo=e.target.value; if(currentMode==="iap") renderForOffer(); else renderTable(appPriceResults); });
$("tableFilter").addEventListener("input", debounce(()=>{ renderTable(currentTableData); }, 150));
document.querySelectorAll("th[data-sort]").forEach(th=>{
  th.addEventListener("click", ()=>{
    if(sortKey===th.dataset.sort) sortDir*=-1; else { sortKey=th.dataset.sort; sortDir=1; }
    renderTable(currentTableData);
  });
});
document.querySelectorAll(".mode-tabs button").forEach(b=>{
  b.addEventListener("click", ()=>{
    document.querySelectorAll(".mode-tabs button").forEach(x=>x.classList.toggle("active", x===b));
    currentMode = b.dataset.mode;
    if (currentApp) runQuery();
  });
});

/* 语言切换 */
document.querySelectorAll(".lang-switch button").forEach(b => {
  b.addEventListener("click", () => {
    LANG = b.dataset.lang;
    localStorage.setItem("aptLang", LANG);
    applyI18N();
    renderWatchlist();
    renderDetailHeader();
    if (currentApp){
      if (currentMode === "iap" && allOffers.length){
        renderOfferBar();
        renderForOffer();
      } else if (currentMode === "app" && appPriceResults.length){
        renderTable(appPriceResults);
      }
    }
  });
});

/* SKU 模糊搜索 */
$("offerSearch")?.addEventListener("input", debounce(() => {
  renderOfferBar();
  if (allOffersFiltered.length && !allOffersFiltered.find(o => o.offerKey === currentOfferKey)){
    currentOfferKey = allOffersFiltered[0].offerKey;
    renderOfferBar(); renderForOffer();
  }
}, 150));

/* offer chip 点击（事件委托） */
$("offerBar").addEventListener("click", e => {
  const chip = e.target.closest(".offer-chip");
  if (!chip) return;
  currentOfferKey = chip.dataset.key;
  renderOfferBar();
  renderForOffer();
});

/* 家族大表 */
$("familyClose").addEventListener("click", () => $("familyModal").classList.remove("show"));
$("familyModal").addEventListener("click", e => { if (e.target.id==="familyModal") e.target.classList.remove("show"); });
$("familyConvert").addEventListener("change", renderFamilyTable);
$("familyExportBtn").addEventListener("click", exportFamilyCSV);

/* 多 App 对比 */
$("openMultiCompareBtn").addEventListener("click", openMultiCompare);
$("multiPickerCancel").addEventListener("click", () => $("multiPickerModal").classList.remove("show"));
$("multiPickerModal").addEventListener("click", e => { if (e.target.id==="multiPickerModal") e.target.classList.remove("show"); });
$("multiPickerOK").addEventListener("click", () => {
  if (Object.keys(multiPickerSelections).length < 2){ toast(t("pleasePickOffer")); return; }
  $("multiPickerModal").classList.remove("show");
  $("multiConvert").value = convertTo || "CNY";
  renderMultiCompare();
  $("multiCompareModal").classList.add("show");
});
$("multiCompareClose").addEventListener("click", () => $("multiCompareModal").classList.remove("show"));
$("multiCompareModal").addEventListener("click", e => { if (e.target.id==="multiCompareModal") e.target.classList.remove("show"); });
$("multiConvert").addEventListener("change", renderMultiCompare);
$("multiExportBtn").addEventListener("click", exportMultiCSV);

/* ====================== 启动 ====================== */
window.addEventListener("hashchange", route);
(async function boot(){
  await initAuth();
  updateAuthUI();
  route();
  loadFx();
  // 记住的登录态不弹强制改密窗,不打扰浏览;仅提醒
  if (authUser && authUser.mustChange) toast(t("mustChangePwd"), 3000);
})();
</script>
